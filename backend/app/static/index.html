<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>okDriver | Unified CCTV & Video Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100%; min-height: 440px; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/80 px-6 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
      <h1 class="font-bold text-sm tracking-wider uppercase">
        okDriver <span class="text-cyan-400 font-normal">| Integrated CCTV Analytics Command</span>
      </h1>
    </div>
    <div class="flex items-center gap-6 text-xs font-mono">
      <span>CAMERAS: <strong id="stat-cameras" class="text-emerald-400">0 ONLINE</strong></span>
      <span>ACTIVE ALERTS: <strong id="stat-alerts" class="text-rose-400">0</strong></span>
    </div>
  </header>

  <!-- Main View -->
  <main class="flex-1 p-5 grid grid-cols-1 lg:grid-cols-12 gap-5 overflow-hidden">
    <!-- Left Column: Camera Grid & AI Events -->
    <div class="lg:col-span-5 flex flex-col gap-5 overflow-y-auto max-h-[calc(100vh-5.5rem)]">
      <div id="camera-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

      <!-- Real-Time Inferences -->
      <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 flex-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400"></span> Live AI Inference Stream
        </h3>
        <div id="inference-feed" class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
          <p class="text-xs text-slate-500 italic py-4 text-center">Awaiting incoming camera detections...</p>
        </div>
      </div>
    </div>

    <!-- Right Column: Search & GIS Map -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      <div class="flex gap-2 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
        <input
          id="entity-search-input"
          type="text"
          placeholder="Search Vehicle Plate (e.g. GJ01XX0001)..."
          class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 outline-none focus:border-cyan-500"
        />
        <button onclick="traceEntity()" class="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg">
          Trace Route
        </button>
      </div>

      <div class="flex-1 bg-slate-900 rounded-xl border border-slate-800 p-2 overflow-hidden">
        <div id="map"></div>
      </div>

      <div id="trace-summary" class="hidden bg-slate-900 border border-cyan-500/40 p-3 rounded-lg text-xs flex justify-between items-center">
        <span id="trace-text"></span>
        <button onclick="clearTrace()" class="text-slate-400 hover:text-white underline text-[11px]">Clear</button>
      </div>
    </div>
  </main>

<!-- Alert Modal (Fixed above all map panes) -->
  <div id="alert-modal" style="display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.85); z-index: 999999; align-items: center; justify-content: center; padding: 1rem;">
    <div class="bg-slate-900 border-2 border-red-500 rounded-xl max-w-md w-full p-6 text-slate-100 shadow-2xl relative" style="z-index: 1000000;">
      <div class="text-red-400 font-bold text-lg mb-2 flex items-center gap-2">
        <span>⚠️</span> Watchlist Alert Triggered
      </div>
      <div id="alert-modal-content" class="text-xs space-y-1.5 bg-slate-950 p-3 rounded border border-slate-800 mb-4"></div>
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">Operator Audit Notes</label>
        <input
          id="operator-note-input"
          type="text"
          placeholder="e.g. Intercept unit dispatched"
          class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200 outline-none focus:border-cyan-500"
        />
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeModal()" type="button" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded text-slate-300">Dismiss</button>
        <button onclick="resolveCurrentAlert()" type="button" class="px-4 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded">Resolve Alert</button>
      </div>
    </div>
  </div>

  <script>
    let map, markers = {}, polyline = null, currentAlertId = null;
    let cameras = [], alerts = [];

    map = L.map('map').setView([23.0225, 72.5714], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    async function init() {
      const camRes = await fetch('/api/v1/cameras');
      cameras = await camRes.json();
      const alertRes = await fetch('/api/v1/alerts');
      alerts = await alertRes.json();

      renderCameras();
      renderStats();
      setupMap();
      setupWebSocket();
    }

    function renderStats() {
      const online = cameras.filter(c => c.status === 'Online').length;
      const active = alerts.filter(a => a.status === 'ACTIVE').length;
      document.getElementById('stat-cameras').innerText = `${online}/${cameras.length} ONLINE`;
      document.getElementById('stat-alerts').innerText = active;
    }

    function renderCameras() {
      const grid = document.getElementById('camera-grid');
      grid.innerHTML = cameras.map(cam => `
        <div class="relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800">
          <div class="absolute top-2 left-2 z-10 bg-slate-900/85 px-2 py-0.5 rounded text-[11px] text-white flex items-center gap-1.5 border border-slate-700">
            <span class="w-2 h-2 rounded-full ${cam.status === 'Online' ? 'bg-emerald-400' : 'bg-amber-400'}"></span>
            ${cam.id} | ${cam.zone}
          </div>
          <video src="${cam.stream_endpoint}" autoplay loop muted playsinline class="w-full h-40 object-cover"></video>
          <div class="p-2 bg-slate-900 text-xs flex justify-between text-slate-400 border-t border-slate-800">
            <span class="truncate">${cam.name}</span>
            <span class="font-mono text-[10px] uppercase bg-slate-800 px-1 rounded text-slate-300">${cam.source_protocol}</span>
          </div>
        </div>
      `).join('');
    }

    function setupMap() {
      cameras.forEach(cam => {
        const marker = L.marker([cam.latitude, cam.longitude]).addTo(map);
        marker.bindPopup(`<b>${cam.id}: ${cam.name}</b><br>Zone: ${cam.zone}<br>Status: ${cam.status}`);
        markers[cam.id] = marker;
      });
    }

    function setupWebSocket() {
      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);

      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'NEW_DETECTION') {
          addInference(msg.data);
        } else if (msg.type === 'NEW_ALERT') {
          alerts.unshift(msg.data);
          renderStats();
          showAlertModal(msg.data);
        }
      };
    }

    function addInference(ev) {
      const feed = document.getElementById('inference-feed');
      if (feed.children[0]?.tagName === 'P') feed.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'text-[11px] bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center';
      div.innerHTML = `
        <div><strong class="font-mono text-cyan-400">${ev.vehicle_number || 'UNKNOWN'}</strong> <span class="text-slate-500">[${ev.camera_id}]</span></div>
        <span class="text-[10px] text-slate-400 font-mono">${(ev.confidence * 100).toFixed(0)}% conf</span>
      `;
      feed.prepend(div);
    }

function showAlertModal(alert) {
      currentAlertId = alert.id;
      const modal = document.getElementById('alert-modal');
      const content = document.getElementById('alert-modal-content');
      content.innerHTML = `
        <p><strong class="text-slate-400">Target Plate:</strong> <span class="text-amber-400 font-mono font-bold text-sm">${alert.matched_identifier}</span></p>
        <p><strong class="text-slate-400">Category:</strong> <span class="text-rose-400 font-semibold">${alert.category}</span></p>
        <p><strong class="text-slate-400">Location:</strong> ${alert.camera_name} (${alert.camera_id})</p>
        <p><strong class="text-slate-400">Details:</strong> ${alert.notes || 'Suspect vehicle'}</p>
        <p><strong class="text-slate-400">Severity:</strong> <span class="text-red-500 font-bold">${alert.severity}</span></p>
      `;
      // Force modal display directly via inline style
      modal.style.setProperty('display', 'flex', 'important');
    }

    function closeModal() {
      const modal = document.getElementById('alert-modal');
      modal.style.setProperty('display', 'none', 'important');
    }

    async function resolveCurrentAlert() {
      if (!currentAlertId) return;
      await fetch(`/api/v1/alerts/${currentAlertId}/resolve`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'RESOLVED', operator_notes: 'Acknowledged via UI' })
      });
      const target = alerts.find(a => a.id === currentAlertId);
      if (target) target.status = 'RESOLVED';
      renderStats();
      closeModal();
    }

    async function traceEntity() {
      const q = document.getElementById('entity-search-input').value.trim();
      if (!q) return;
      const res = await fetch(`/api/v1/entities/trace?identifier=${encodeURIComponent(q)}`);
      const data = await res.json();
      
      if (polyline) map.removeLayer(polyline);

      if (data.history.length > 0) {
        const latlngs = data.history.map(h => [h.latitude, h.longitude]);
        polyline = L.polyline(latlngs, { color: '#ef4444', weight: 4, dashArray: '6, 8' }).addTo(map);
        map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

        document.getElementById('trace-summary').classList.remove('hidden');
        document.getElementById('trace-text').innerHTML = `Traced <strong class="text-cyan-400">${q.toUpperCase()}</strong> across ${data.history.length} checkpoints.`;
      } else {
        alert('No movement events found for this identifier.');
      }
    }

    function clearTrace() {
      if (polyline) map.removeLayer(polyline);
      document.getElementById('trace-summary').classList.add('hidden');
      document.getElementById('entity-search-input').value = '';
    }

    init();
  </script>
</body>
</html>
